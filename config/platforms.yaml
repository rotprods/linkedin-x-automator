# Plataformas — idioma, formato y publicación multi-plataforma
# auto_publish es el KILL-SWITCH global. false = no publica nada.
auto_publish: false   # <-- por defecto false (seguro). El alumno lo activa tras el GO.

platforms:
  x:
    enabled: true
    language: {IDIOMA_X}              # p. ej. english
    handle: "{TU_HANDLE_X}"           # p. ej. @tuusuario
    max_chars: 280
    formats: [text, image, video]
    cadence_per_day: 9
    timezone: "{TU_TIMEZONE}"         # p. ej. Europe/Madrid
    best_hours: [{TUS_BEST_HOURS}]    # p. ej. [08:00, 12:00, 18:00]
    aspect_ratio: "1:1"
  linkedin:
    enabled: true
    language: {IDIOMA_LI}             # p. ej. spanish
    profile: "{TU_NOMBRE}"
    max_chars: 3000
    formats: [text, carousel, image, video]
    cadence_per_day: 3
    timezone: "{TU_TIMEZONE}"
    best_hours: [{TUS_BEST_HOURS_LI}]
    aspect_ratio: "16:9"
  youtube:
    enabled: false
    language: {IDIOMA_YT}
    channel: "{TU_NOMBRE}"
    formats: [video_16x9, short_9x16]
    cadence_per_week: 2
    aspect_ratio: "16:9"
  tiktok:
    enabled: false
    language: {IDIOMA_TK}
    account: "{TU_ACCOUNT_TK}"
    formats: [video_9x16]